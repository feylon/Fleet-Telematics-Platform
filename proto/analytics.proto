syntax = "proto3";

package analytics.v1;

import "common.proto";

message TimeRange {
  string organization_id = 1;
  string from = 2;
  string to = 3;
}

message FleetSummary {
  double total_mileage_km = 1;
  double total_fuel_consumed = 2;
  double avg_speed = 3;
  double max_speed = 4;
  int64 moving_seconds = 5;
  int64 idle_seconds = 6;
  int64 pings = 7;
  int64 alerts = 8;
  int32 active_vehicles = 9;
}

message VehicleSeriesRequest {
  string organization_id = 1;
  string vehicle_id = 2;
  string from = 3;
  string to = 4;
  int32 bucket_seconds = 5;
}

message SeriesPoint {
  string timestamp = 1;
  double speed = 2;
  double fuel_level = 3;
  double engine_temp = 4;
  double latitude = 5;
  double longitude = 6;
  double heading = 7;
  bool is_moving = 8;
}

message VehicleSeriesResponse {
  repeated SeriesPoint points = 1;
}

message TrackRequest {
  string organization_id = 1;
  string vehicle_id = 2;
  string from = 3;
  string to = 4;
  int32 limit = 5;
}

message DriverScore {
  string vehicle_id = 1;
  string driver_id = 2;
  string driver_name = 3;
  string plate_number = 4;
  double mileage_km = 5;
  int64 harsh_brakes = 6;
  int64 speeding_events = 7;
  int64 over_rev_events = 8;
  double score = 9;
}

message DriverScoresResponse {
  repeated DriverScore items = 1;
}

message DriverScoreRequest {
  string organization_id = 1;
  string vehicle_id = 2;
  string from = 3;
  string to = 4;
}

message DailyRollup {
  string day = 1;
  string vehicle_id = 2;
  double mileage_km = 3;
  int64 moving_seconds = 4;
  int64 idle_seconds = 5;
  double max_speed = 6;
  double fuel_consumed = 7;
  int64 harsh_events = 8;
  int64 speeding_events = 9;
}

message DailyRollupResponse {
  repeated DailyRollup items = 1;
}

message AlertsQuery {
  string organization_id = 1;
  string vehicle_id = 2;
  string alert_type = 3;
  string severity = 4;
  string from = 5;
  string to = 6;
  common.v1.Pagination pagination = 7;
}

message AlertRow {
  string timestamp = 1;
  string vehicle_id = 2;
  string alert_type = 3;
  string severity = 4;
  string details = 5;
  double latitude = 6;
  double longitude = 7;
}

message AlertsResponse {
  repeated AlertRow items = 1;
  common.v1.PageMeta meta = 2;
}

message AlertCount {
  string alert_type = 1;
  int64 count = 2;
}

message AlertStatsResponse {
  repeated AlertCount items = 1;
}

message ReportRequest {
  string organization_id = 1;
  string report_type = 2;
  string format = 3;
  string from = 4;
  string to = 5;
  string locale = 6;
  string requested_by = 7;
  string vehicle_id = 8;
}

message ReportJob {
  string job_id = 1;
  string status = 2;
  string file_name = 3;
  string created_at = 4;
  string report_type = 5;
  string format = 6;
  string error = 7;
}

message ReportJobsRequest {
  string organization_id = 1;
}

message ReportJobsResponse {
  repeated ReportJob items = 1;
}

message ReportJobRequest {
  string organization_id = 1;
  string job_id = 2;
}

message ReportFile {
  string file_name = 1;
  string path = 2;
  string content_type = 3;
  bool ready = 4;
}

message IngestStats {
  int64 rows_last_minute = 1;
  int64 rows_last_hour = 2;
  int64 alerts_last_hour = 3;
  int64 total_rows = 4;
  string latest_timestamp = 5;
}

message HeatmapRequest {
  string organization_id = 1;
  string from = 2;
  string to = 3;
  int32 precision = 4;
}

message HeatmapCell {
  double latitude = 1;
  double longitude = 2;
  int64 weight = 3;
}

message HeatmapResponse {
  repeated HeatmapCell cells = 1;
}

service AnalyticsService {
  rpc Summary (TimeRange) returns (FleetSummary);
  rpc VehicleSeries (VehicleSeriesRequest) returns (VehicleSeriesResponse);
  rpc Track (TrackRequest) returns (VehicleSeriesResponse);
  rpc DriverScores (DriverScoreRequest) returns (DriverScoresResponse);
  rpc DailyRollups (TimeRange) returns (DailyRollupResponse);
  rpc Alerts (AlertsQuery) returns (AlertsResponse);
  rpc AlertStats (TimeRange) returns (AlertStatsResponse);
  rpc Heatmap (HeatmapRequest) returns (HeatmapResponse);
  rpc RequestReport (ReportRequest) returns (ReportJob);
  rpc ListReports (ReportJobsRequest) returns (ReportJobsResponse);
  rpc GetReportFile (ReportJobRequest) returns (ReportFile);
  rpc Ingest (common.v1.Empty) returns (IngestStats);
}
