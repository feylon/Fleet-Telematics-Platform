syntax = "proto3";

package dispatch.v1;

import "common.proto";

message Checkpoint {
  string id = 1;
  int32 sequence = 2;
  string name = 3;
  double latitude = 4;
  double longitude = 5;
  int32 radius_m = 6;
  string reached_at = 7;
}

message Route {
  string id = 1;
  string order_id = 2;
  repeated common.v1.GeoPoint polyline = 3;
  float distance_km = 4;
  float deviation_threshold_km = 5;
  repeated Checkpoint checkpoints = 6;
}

message Order {
  string id = 1;
  string organization_id = 2;
  string order_number = 3;
  string customer_name = 4;
  string cargo_description = 5;
  float cargo_weight_kg = 6;
  string status = 7;
  string priority = 8;
  string origin_address = 9;
  double origin_latitude = 10;
  double origin_longitude = 11;
  string destination_address = 12;
  double destination_latitude = 13;
  double destination_longitude = 14;
  string vehicle_id = 15;
  string driver_id = 16;
  string planned_start_at = 17;
  string planned_end_at = 18;
  string started_at = 19;
  string completed_at = 20;
  string notes = 21;
  string created_by_id = 22;
  string created_at = 23;
  string updated_at = 24;
  Route route = 25;
}

message OrderInput {
  string organization_id = 1;
  string customer_name = 2;
  string cargo_description = 3;
  float cargo_weight_kg = 4;
  string priority = 5;
  string origin_address = 6;
  double origin_latitude = 7;
  double origin_longitude = 8;
  string destination_address = 9;
  double destination_latitude = 10;
  double destination_longitude = 11;
  string planned_start_at = 12;
  string planned_end_at = 13;
  string notes = 14;
  string created_by_id = 15;
  string order_number = 16;
}

message UpdateOrderRequest {
  string id = 1;
  OrderInput input = 2;
}

message ListOrdersRequest {
  string organization_id = 1;
  string status = 2;
  string search = 3;
  string driver_id = 4;
  string vehicle_id = 5;
  common.v1.Pagination pagination = 6;
}

message ListOrdersResponse {
  repeated Order items = 1;
  common.v1.PageMeta meta = 2;
}

message AssignOrderRequest {
  string id = 1;
  string organization_id = 2;
  string vehicle_id = 3;
  string driver_id = 4;
}

message TransitionOrderRequest {
  string id = 1;
  string organization_id = 2;
  string status = 3;
  string actor_driver_id = 4;
}

message CheckpointInput {
  int32 sequence = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  int32 radius_m = 5;
}

message SetRouteRequest {
  string order_id = 1;
  string organization_id = 2;
  repeated common.v1.GeoPoint polyline = 3;
  float deviation_threshold_km = 4;
  repeated CheckpointInput checkpoints = 5;
}

message ActiveRouteRequest {
  string organization_id = 1;
  string vehicle_id = 2;
}

message ActiveRouteResponse {
  bool found = 1;
  string order_id = 2;
  Route route = 3;
}

message NearbyRequest {
  string organization_id = 1;
  double latitude = 2;
  double longitude = 3;
  double radius_km = 4;
  int32 limit = 5;
}

message NearbyVehicle {
  string vehicle_id = 1;
  string plate_number = 2;
  double latitude = 3;
  double longitude = 4;
  double distance_km = 5;
  string status = 6;
  string driver_name = 7;
}

message NearbyResponse {
  repeated NearbyVehicle items = 1;
}

message DriverOrdersRequest {
  string organization_id = 1;
  string driver_id = 2;
}

service OrderService {
  rpc Create (OrderInput) returns (Order);
  rpc Update (UpdateOrderRequest) returns (Order);
  rpc Get (common.v1.IdRequest) returns (Order);
  rpc List (ListOrdersRequest) returns (ListOrdersResponse);
  rpc Delete (common.v1.IdRequest) returns (common.v1.DeleteResponse);
  rpc Assign (AssignOrderRequest) returns (Order);
  rpc Transition (TransitionOrderRequest) returns (Order);
  rpc DriverOrders (DriverOrdersRequest) returns (ListOrdersResponse);
  rpc Nearby (NearbyRequest) returns (NearbyResponse);
}

service RouteService {
  rpc SetRoute (SetRouteRequest) returns (Route);
  rpc ActiveRouteForVehicle (ActiveRouteRequest) returns (ActiveRouteResponse);
}
